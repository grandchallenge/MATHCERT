name: OTP Permanent full-formula certification

on:
  pull_request:
    paths:
      - ".github/workflows/otp-permanent-full-formula-cert.yml"
      - "ci/run_openai_ten_proofs_permanent_full_formula_replay.sh"
      - "ci/otp_full_formula_contract_membership.py"
      - "ci/validate_otp_permanent_full_formula_certification.py"
      - "ci/test_otp_permanent_full_formula_certification.py"
      - "schemas/otp_permanent_full_formula_certification.schema.json"
      - "governance/result_family_intake_successors/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_work_package_successors/OTP-C-PERMANENT-FULL-FORMULA-CERT-WP01.json"
      - "governance/result_family_replay_evidence_successors/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_route_proposal_successors/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/certification_route_overlays/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_adjudication_contract_successors/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_adjudications/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_output_contracts/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_output_contract_successors/OTP-C-PERMANENT-FULL-FORMULA.json"
      - "governance/result_family_output_candidates/staged_certificates/MC-OTP-C-PERMANENT-FULL-FORMULA-001.json"
      - "governance/result_family_output_candidates/staged_route_transitions/OTP-C-PERMANENT-FULL-FORMULA.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-control:
    name: governance-control (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      MATHCERT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out literal candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MATHCERT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify literal candidate head
        shell: bash
        if: runner.os != 'Windows'
        run: test "$(git rev-parse HEAD)" = "$MATHCERT_HEAD_SHA"
      - name: Verify literal candidate head (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          if ((git rev-parse HEAD) -ne $env:MATHCERT_HEAD_SHA) { throw "MATHCERT checkout is not the literal PR head" }
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate fail-closed successor chain
        run: |
          python ci/validate_otp_permanent_full_formula_certification.py
          python ci/test_otp_permanent_full_formula_certification.py

  replay:
    name: exact-full-formula-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MATHCERT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MATHCERT_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out literal MATHCERT subject head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MATHCERT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify literal candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$MATHCERT_HEAD_SHA"
      - name: Install locked MATHCERT CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check out exact Forge authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHFORGE
          ref: 26309b3aa1ce21e8d74683235de76b491f62f17c
          path: forge
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Solve authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHSOLVE
          ref: bebc35818c6d3b79ddc7e348c9bffd328279cd24
          path: solve
          fetch-depth: 1
          persist-credentials: false

      - name: Reacquire protected GCL archival source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openai-ten-proofs-e62211d2.tar"
          curl --fail --location --retry 4 --silent --show-error \
            "https://github.com/grandchallenge/MATHFORGE/releases/download/otp-c-permanent-source-e62211d2-candidate-001/openai-ten-proofs-e62211d2.tar" \
            -o "$archive"
          test "$(stat -c '%s' "$archive")" = "21022720"
          echo "3022e62ffbed8f5f74d232034a703dc645e6b301879dff1e87df72979914294f  $archive" | sha256sum --check --strict
          mkdir upstream
          tar -xf "$archive" -C upstream --strip-components=1
          test -f upstream/Permanent.lean
          test -f upstream/ComparatorChallenges/C_PermanentFormulaLowerBound.json

      - name: Bootstrap project dependencies
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          lake-package-directory: upstream

      - name: Activate governed Lean 4.32.0
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain list | grep -Fq 'leanprover/lean4:v4.32.0' || elan toolchain install leanprover/lean4:v4.32.0
          elan run leanprover/lean4:v4.32.0 lean --version | grep -F "version 4.32.0"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.32.0" >> "$GITHUB_ENV"

      - name: Build pinned Comparator toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools "$RUNNER_TEMP/otp-bin"
          git clone --filter=blob:none https://github.com/leanprover/lean4export.git tools/lean4export
          git -C tools/lean4export checkout --detach 4e7915201d3f9f04470d9eae002fa695f7cdc589
          (cd tools/lean4export && lake build)
          git clone --filter=blob:none https://github.com/ammkrn/nanoda_lib.git tools/nanoda
          git -C tools/nanoda checkout --detach ddfac2bf5a7b56cb46e141494427ff3dd55963c7
          (cd tools/nanoda && cargo build --release --locked)
          git clone --filter=blob:none https://github.com/Zouuup/landrun.git tools/landrun
          git -C tools/landrun checkout --detach 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd tools/landrun && go build -trimpath -o "$RUNNER_TEMP/otp-bin/landrun-real" ./cmd/landrun)
          cp ci/landrun_comparator_adapter.sh "$RUNNER_TEMP/otp-bin/landrun"
          chmod +x "$RUNNER_TEMP/otp-bin/landrun" "$RUNNER_TEMP/otp-bin/landrun-real"
          echo "$RUNNER_TEMP/otp-bin" >> "$GITHUB_PATH"
          echo "COMPARATOR_LANDRUN=$RUNNER_TEMP/otp-bin/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_LANDRUN_REAL=$RUNNER_TEMP/otp-bin/landrun-real" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/tools/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$GITHUB_WORKSPACE/tools/nanoda/target/release/nanoda_bin" >> "$GITHUB_ENV"

      - name: Prepare locked upstream dependencies
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Validate governed records
        shell: bash
        run: |
          python ci/validate_otp_permanent_full_formula_certification.py
          python ci/test_otp_permanent_full_formula_certification.py

      - name: Execute isolated full-formula replay
        shell: bash
        run: |
          chmod +x ci/run_openai_ten_proofs_permanent_full_formula_replay.sh
          ci/run_openai_ten_proofs_permanent_full_formula_replay.sh evidence/permanent-full-formula

      - name: Upload full-formula replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otp-permanent-full-formula-evidence
          path: evidence/permanent-full-formula/
          if-no-files-found: warn
          retention-days: 30
