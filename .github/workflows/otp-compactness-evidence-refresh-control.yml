name: OTP Compactness evidence refresh control

on:
  pull_request:
    paths:
      - ".github/workflows/otp-compactness-evidence-refresh-control.yml"
      - "requirements-ci.txt"
      - "governance/result_family_evidence_refreshes/OTP-J1-COMPACTNESS.json"
      - "governance/result_family_evidence_refresh_execution_candidates/OTP-J1-COMPACTNESS.json"
      - "governance/result_family_adjudication_contracts/OTP-J1-COMPACTNESS.json"
      - "governance/result_family_replay_evidence/OTP-J1-COMPACTNESS.json"
      - "governance/certification_routes.json"
      - "schemas/openai_ten_proofs_compactness_evidence_refresh.schema.json"
      - "ci/validate_otp_compactness_evidence_refresh.py"
      - "ci/test_otp_compactness_evidence_refresh.py"
      - "evidence/openai_ten_proofs/compactness_refresh/**"
      - "docs/work_packages/OTP-J1-COMPACTNESS-CERT-EVIDENCE-REFRESH-001.md"
      - "docs/work_packages/OTP-J1-COMPACTNESS-CERT-EVIDENCE-REFRESH-001-CLAIM-BOUNDARY.md"
      - "ci/check_lean.sh"
      - "ci/check_lean.ps1"
      - "governance/ci_control_registry.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-refresh-control:
    name: evidence-refresh-control (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install locked CI dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate Compactness evidence refresh
        run: python ci/certification_route_state.py exec ci/validate_otp_compactness_evidence_refresh.py
      - name: Run adversarial mutations
        run: python ci/certification_route_state.py exec ci/test_otp_compactness_evidence_refresh.py
