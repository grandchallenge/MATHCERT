name: OTP Permanent adjudication

on:
  pull_request:
    paths:
      - ".github/workflows/otp-permanent-adjudication.yml"
      - "requirements-ci.txt"
      - "governance/result_family_adjudications/OTP-C-PERMANENT.json"
      - "schemas/openai_ten_proofs_permanent_adjudication.schema.json"
      - "ci/validate_otp_permanent_adjudication.py"
      - "ci/test_otp_permanent_adjudication.py"
      - "ci/validate_otp_permanent_execution_candidate.py"
      - "ci/test_otp_permanent_execution_candidate.py"
      - "governance/result_family_execution_candidates/OTP-C-PERMANENT.json"
      - "governance/result_family_execution_candidate_manifests/OTP-C-PERMANENT.json"
      - "governance/result_family_adjudication_contracts/OTP-C-PERMANENT.json"
      - "governance/adjudication_design/OPENAI_TEN_PROOFS_PERMANENT_ADJUDICATION_CONTRACT.json"
      - "evidence/openai_ten_proofs/permanent_candidate/**"
      - "governance/certification_routes.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adjudication-control:
    name: adjudication-control (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact adjudication head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked CI dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate Permanent adjudication
        run: python ci/certification_route_state.py exec ci/validate_otp_permanent_adjudication.py
      - name: Run adversarial mutations
        run: python ci/certification_route_state.py exec ci/test_otp_permanent_adjudication.py
