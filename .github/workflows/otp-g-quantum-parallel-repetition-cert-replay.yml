name: OTP G quantum parallel repetition exact replay
on:
  pull_request:
    paths:
      - '.github/workflows/otp-g-quantum-parallel-repetition-cert-replay.yml'
      - 'ci/run_openai_ten_proofs_quantum_parallel_repetition_replay.sh'
      - 'ci/validate_otp_g_quantum_parallel_repetition_certification.py'
      - 'ci/test_otp_g_quantum_parallel_repetition_certification.py'
      - 'governance/result_family_work_package_successors/OTP-G-QUANTUM-PARALLEL-REPETITION-CERT-WP-001.json'
      - 'governance/result_family_adjudications/OTP-G-QUANTUM-PARALLEL-REPETITION.json'
      - 'governance/result_family_output_contracts/OTP-G-QUANTUM-PARALLEL-REPETITION.json'
      - 'certificates/formal_sources/MC-OTP-G-QUANTUM-PARALLEL-REPETITION-001.json'
      - 'governance/certification_routes.json'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay-g-quantum-parallel-repetition:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env: {MATHCERT_HEAD_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.MATHCERT_HEAD_SHA }}', fetch-depth: 0, persist-credentials: false}
      - run: test "$(git rev-parse HEAD)" = "$MATHCERT_HEAD_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: openai/ten-proofs, ref: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6, path: upstream, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: grandchallenge/MATHFORGE, ref: f0a40146cca7fd39c5724ed5be033ee9092625ac, path: forge, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: grandchallenge/MATHSOLVE, ref: 4f384b510a557292ce999f02baacec45c534888a, path: solve, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: Zouuup/landrun, ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4, path: landrun-src, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: leanprover/lean4export, ref: 4e7915201d3f9f04470d9eae002fa695f7cdc589, path: lean4export-src, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: ammkrn/nanoda_lib, ref: ddfac2bf5a7b56cb46e141494427ff3dd55963c7, path: nanoda-src, fetch-depth: 1, persist-credentials: false}
      - uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with: {auto-config: false, build: false, test: false, lint: false, use-mathlib-cache: false, lake-package-directory: upstream}
      - name: Activate Lean and build pinned helpers
        run: |
          elan toolchain list | grep -Fq 'leanprover/lean4:v4.32.0' || elan toolchain install leanprover/lean4:v4.32.0
          echo 'ELAN_TOOLCHAIN=leanprover/lean4:v4.32.0' >> "$GITHUB_ENV"
          (cd landrun-src && go build -trimpath -o ../landrun ./cmd/landrun)
          (cd lean4export-src && lake build)
          (cd nanoda-src && cargo build --release --locked)
          chmod +x ci/otp_landrun_argv_adapter.sh landrun
          echo "COMPARATOR_LANDRUN=$GITHUB_WORKSPACE/ci/otp_landrun_argv_adapter.sh" >> "$GITHUB_ENV"
          echo "COMPARATOR_LANDRUN_REAL=$GITHUB_WORKSPACE/landrun" >> "$GITHUB_ENV"
          echo "REAL_LANDRUN=$GITHUB_WORKSPACE/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/lean4export-src/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$GITHUB_WORKSPACE/nanoda-src/target/release/nanoda_bin" >> "$GITHUB_ENV"
      - working-directory: upstream
        run: lake exe cache get
      - name: Execute exact G replay
        run: |
          chmod +x ci/run_openai_ten_proofs_quantum_parallel_repetition_replay.sh
          ci/run_openai_ten_proofs_quantum_parallel_repetition_replay.sh evidence/g-quantum-parallel-repetition
      - name: Validate restricted qualification
        run: |
          python3 ci/validate_otp_g_quantum_parallel_repetition_certification.py
          python3 ci/test_otp_g_quantum_parallel_repetition_certification.py -v
      - name: Upload G evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: otp-g-quantum-parallel-repetition-exact-evidence, path: 'evidence/g-quantum-parallel-repetition/', if-no-files-found: warn, retention-days: 30}
