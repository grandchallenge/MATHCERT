name: OTP A sphere-packing output design

on:
  pull_request:
    paths:
      - '.github/workflows/otp-a-sphere-packing-output-design.yml'
      - 'governance/result_family_output_contracts/OTP-A-SPHERE-PACKING.json'
      - 'schemas/otp_a_sphere_packing_output_contract.schema.json'
      - 'schemas/otp_a_sphere_packing_qualified_output.schema.json'
      - 'ci/validate_otp_a_sphere_packing_output_contract.py'
      - 'ci/test_otp_a_sphere_packing_output_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert literal candidate head
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate output design
        run: |
          python ci/validate_otp_a_sphere_packing_output_contract.py
          python -m unittest ci/test_otp_a_sphere_packing_output_contract.py -v
          python -m json.tool schemas/otp_a_sphere_packing_output_contract.schema.json > /dev/null
          python -m json.tool schemas/otp_a_sphere_packing_qualified_output.schema.json > /dev/null

  current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reacquire exact current source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 https://cdn.openai.com/pdf/ten-proofs-oai.pdf -o "$RUNNER_TEMP/ten-proofs-oai.pdf"
          test "$(wc -c < "$RUNNER_TEMP/ten-proofs-oai.pdf")" = "2487031"
          echo 'ebc561ab5c53dbd240e17a8fdb6fffeb648591eca85dbfc7466f563638f8c566  '"$RUNNER_TEMP/ten-proofs-oai.pdf" | sha256sum -c -
