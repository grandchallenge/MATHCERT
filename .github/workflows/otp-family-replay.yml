name: OTP family replay

on:
  pull_request:
    paths:
      - ".github/workflows/otp-family-replay.yml"
      - "ci/landrun_comparator_adapter.sh"
      - "ci/run_openai_ten_proofs_family_replay.sh"
      - "ci/validate_openai_ten_proofs_replay_execution.py"
      - "ci/test_openai_ten_proofs_replay_execution.py"
      - "ci/validate_openai_ten_proofs_replay_evidence.py"
      - "ci/test_openai_ten_proofs_replay_evidence.py"
      - "ci/validate_openai_ten_proofs_route_registrations_with_j2_successor.py"
      - "governance/pre_route_candidates/OPENAI_TEN_PROOFS_WP03_REPLAY_EXECUTION.json"
      - "governance/pre_route_candidates/OPENAI_TEN_PROOFS_WP04_REPLAY_EVIDENCE.json"
      - "governance/result_family_replay_evidence/**"
      - "evidence/openai_ten_proofs/*.zip.b64"
      - "schemas/openai_ten_proofs_replay_execution.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: replay-${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MATHCERT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HISTORICAL_UPSTREAM_COMMIT: e62211d28e3a9131950c89caa6542cfe5eff3bca
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: ehrhart
            family: OTP-F-EHRHART
            config: ComparatorChallenges/F_EhrhartVolumeInequality.json
            solution: EhrhartVolumeInequality
            challenge: ComparatorChallenges.F_EhrhartVolumeInequality
          - slug: compactness
            family: OTP-J1-COMPACTNESS
            config: ComparatorChallenges/J_CompactnessConjecture.json
            solution: CompactnessAndDegeneracy
            challenge: ComparatorChallenges.J_CompactnessConjecture
          - slug: two-degenerate
            family: OTP-J2-TWO-DEGENERATE
            config: ComparatorChallenges/J_TwoDegenerateGraphs.json
            solution: CompactnessAndDegeneracy
            challenge: ComparatorChallenges.J_TwoDegenerateGraphs
    steps:
      - name: Check out literal MATHCERT subject head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MATHCERT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify literal MATHCERT head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHCERT_HEAD_SHA"

      - name: Probe historical upstream replay subject
        id: historical
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream
          git init -q upstream
          git -C upstream remote add origin https://github.com/openai/ten-proofs
          if git -C upstream fetch --no-tags --depth=1 origin "$HISTORICAL_UPSTREAM_COMMIT" >/tmp/otp-historical-fetch.log 2>&1; then
            git -C upstream checkout --detach FETCH_HEAD
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Historical upstream replay subject remains fetchable."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            mkdir -p "evidence/${{ matrix.slug }}"
            {
              echo "status=HISTORICAL_UPSTREAM_REF_UNAVAILABLE__RETAINED_EVIDENCE_VERIFICATION_REQUIRED"
              echo "family=${{ matrix.family }}"
              echo "historical_upstream_commit=$HISTORICAL_UPSTREAM_COMMIT"
              echo "mathcert_head=$MATHCERT_HEAD_SHA"
              echo "reason=The protected historical upstream commit is no longer advertised or fetchable from openai/ten-proofs. Historical replay evidence is not repinned or rewritten."
              echo "fresh_historical_replay_performed=false"
              echo "current_j2_replay_authority=separate dedicated source-faithful workflows"
            } > "evidence/${{ matrix.slug }}/historical-upstream-unavailability.txt"
            cat /tmp/otp-historical-fetch.log >> "evidence/${{ matrix.slug }}/historical-upstream-unavailability.txt"
          fi

      - name: Install locked CI dependencies for archival verification
        if: steps.historical.outputs.available != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Verify retained protected replay evidence when historical ref is unavailable
        if: steps.historical.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python ci/certification_route_state.py exec ci/validate_openai_ten_proofs_replay_execution.py
          python ci/certification_route_state.py exec ci/test_openai_ten_proofs_replay_execution.py
          python ci/certification_route_state.py exec ci/validate_openai_ten_proofs_replay_evidence.py
          python ci/certification_route_state.py exec ci/test_openai_ten_proofs_replay_evidence.py
          python ci/certification_route_state.py exec ci/validate_openai_ten_proofs_route_registrations_with_j2_successor.py
          {
            echo "retained_replay_execution=clear"
            echo "retained_replay_evidence=clear"
            echo "current_route_authority=clear"
            echo "historical_bytes_rewritten=false"
            echo "fresh_historical_replay_claimed=false"
          } > "evidence/${{ matrix.slug }}/retained-evidence-validation.txt"

      - name: Check out exact Forge semantic authority
        if: steps.historical.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHFORGE
          ref: cb0a203c36a9ef33270d62ab369df7bc27d3b242
          path: forge
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Solve producer authority
        if: steps.historical.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHSOLVE
          ref: 443daf537dc7e4ee34ab43aeb01508d9177816ab
          path: solve
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap historical project dependencies
        if: steps.historical.outputs.available == 'true'
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          lake-package-directory: upstream

      - name: Activate governed Lean 4.32.0
        if: steps.historical.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain list | grep -Fq 'leanprover/lean4:v4.32.0' || elan toolchain install leanprover/lean4:v4.32.0
          elan run leanprover/lean4:v4.32.0 lean --version | grep -F "version 4.32.0"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.32.0" >> "$GITHUB_ENV"

      - name: Build pinned Comparator toolchain
        if: steps.historical.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lean --version | grep -F "version 4.32.0"
          mkdir -p tools "$RUNNER_TEMP/otp-bin"
          git clone --filter=blob:none https://github.com/leanprover/lean4export.git tools/lean4export
          git -C tools/lean4export checkout --detach 4e7915201d3f9f04470d9eae002fa695f7cdc589
          (cd tools/lean4export && lake build)
          git clone --filter=blob:none https://github.com/ammkrn/nanoda_lib.git tools/nanoda
          git -C tools/nanoda checkout --detach ddfac2bf5a7b56cb46e141494427ff3dd55963c7
          (cd tools/nanoda && cargo build --release --locked)
          git clone --filter=blob:none https://github.com/Zouuup/landrun.git tools/landrun
          git -C tools/landrun checkout --detach 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd tools/landrun && go build -trimpath -o "$RUNNER_TEMP/otp-bin/landrun-real" ./cmd/landrun)
          cp ci/landrun_comparator_adapter.sh "$RUNNER_TEMP/otp-bin/landrun"
          chmod +x "$RUNNER_TEMP/otp-bin/landrun" "$RUNNER_TEMP/otp-bin/landrun-real"
          echo "$RUNNER_TEMP/otp-bin" >> "$GITHUB_PATH"
          echo "COMPARATOR_LANDRUN=$RUNNER_TEMP/otp-bin/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_LANDRUN_REAL=$RUNNER_TEMP/otp-bin/landrun-real" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/tools/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$GITHUB_WORKSPACE/tools/nanoda/target/release/nanoda_bin" >> "$GITHUB_ENV"

      - name: Prepare historical upstream dependencies
        if: steps.historical.outputs.available == 'true'
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          lean --version | grep -F "version 4.32.0"
          lake exe cache get

      - name: Execute isolated historical family replay
        if: steps.historical.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/run_openai_ten_proofs_family_replay.sh
          ci/run_openai_ten_proofs_family_replay.sh \
            "${{ matrix.family }}" \
            "${{ matrix.config }}" \
            "${{ matrix.solution }}" \
            "${{ matrix.challenge }}" \
            "evidence/${{ matrix.slug }}"

      - name: Upload family compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otp-${{ matrix.slug }}-evidence
          path: evidence/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 30
