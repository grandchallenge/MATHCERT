name: OTP A sphere-packing exact replay

on:
  pull_request:
    paths:
      - ".github/workflows/otp-a-sphere-packing-cert-replay.yml"
      - "ci/run_openai_ten_proofs_sphere_packing_replay.sh"
      - "ci/otp_landrun_argv_adapter.sh"
      - "governance/result_family_replay_evidence_successors/OTP-A-SPHERE-PACKING.json"
      - "schemas/openai_ten_proofs_sphere_packing_replay_evidence.schema.json"
      - "ci/validate_openai_ten_proofs_sphere_packing_replay_evidence.py"
      - "ci/test_openai_ten_proofs_sphere_packing_replay_evidence.py"
      - "evidence/openai_ten_proofs_successors/a-sphere-packing.tar.gz.b64"
      - "governance/ci_control_registry.json"
      - "ci/check_lean.sh"
      - "ci/check_lean.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-a-sphere-packing:
    name: replay-a-sphere-packing
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MATHCERT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MATHCERT_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out literal MATHCERT candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MATHCERT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify literal MATHCERT candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHCERT_HEAD_SHA"

      - name: Check out exact formal subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/ten-proofs
          ref: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Forge composite authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHFORGE
          ref: 706d0291370bf3f14aa37be0823e33d06f7343b0
          path: forge-composite
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Forge bridge authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHFORGE
          ref: 5a0cb9a7b7eef210dd0fce5c527d09b6eef3bc12
          path: forge-bridge
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact Solve producer authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grandchallenge/MATHSOLVE
          ref: c19735edf4c16ac9765bb66c7209bbf11bf1312e
          path: solve
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap exact formal-subject dependencies
        uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          lake-package-directory: upstream

      - name: Activate governed Lean 4.32.0
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain list | grep -Fq 'leanprover/lean4:v4.32.0' || elan toolchain install leanprover/lean4:v4.32.0
          elan run leanprover/lean4:v4.32.0 lean --version | grep -F "version 4.32.0"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.32.0" >> "$GITHUB_ENV"

      - name: Build pinned Comparator helper toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version | grep -F "version 4.32.0"
          mkdir -p tools "$RUNNER_TEMP/otp-bin"

          git clone --filter=blob:none https://github.com/leanprover/lean4export.git tools/lean4export
          git -C tools/lean4export checkout --detach 4e7915201d3f9f04470d9eae002fa695f7cdc589
          (cd tools/lean4export && lake build)

          git clone --filter=blob:none https://github.com/ammkrn/nanoda_lib.git tools/nanoda
          git -C tools/nanoda checkout --detach ddfac2bf5a7b56cb46e141494427ff3dd55963c7
          (cd tools/nanoda && cargo build --release --locked)

          git clone --filter=blob:none https://github.com/Zouuup/landrun.git tools/landrun
          git -C tools/landrun checkout --detach 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd tools/landrun && go build -trimpath -o "$RUNNER_TEMP/otp-bin/landrun-real" ./cmd/landrun)

          cp ci/otp_landrun_argv_adapter.sh "$RUNNER_TEMP/otp-bin/landrun"
          chmod +x "$RUNNER_TEMP/otp-bin/landrun" "$RUNNER_TEMP/otp-bin/landrun-real"

          echo "$RUNNER_TEMP/otp-bin" >> "$GITHUB_PATH"
          echo "COMPARATOR_LANDRUN=$RUNNER_TEMP/otp-bin/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_LANDRUN_REAL=$RUNNER_TEMP/otp-bin/landrun-real" >> "$GITHUB_ENV"
          echo "REAL_LANDRUN=$RUNNER_TEMP/otp-bin/landrun-real" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/tools/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$GITHUB_WORKSPACE/tools/nanoda/target/release/nanoda_bin" >> "$GITHUB_ENV"

      - name: Prepare exact formal-subject cache
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          lean --version | grep -F "version 4.32.0"
          lake exe cache get

      - name: Execute exact A sphere-packing replay
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/run_openai_ten_proofs_sphere_packing_replay.sh
          ci/run_openai_ten_proofs_sphere_packing_replay.sh evidence/a-sphere-packing

      - name: Upload exact A replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otp-a-sphere-packing-exact-evidence
          path: evidence/a-sphere-packing/
          if-no-files-found: warn
          retention-days: 30
