name: Cert checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Capture canonical lake build diagnostic
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          lake build > diagnostics/lake-build.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/lake-build.status
          cat diagnostics/lake-build.log
          exit 0
      - name: Run certification checks
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=MATHCERT canonical control failed::command=${BASH_COMMAND}; exit=${status}"; exit "$status"' ERR
          source ./ci/check_lean.sh
      - name: Upload canonical build diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-canonical-lake-build-diagnostic
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
