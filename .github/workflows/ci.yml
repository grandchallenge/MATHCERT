name: Cert checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce certification platform lane
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && \
             git cat-file -e "origin/${GITHUB_BASE_REF}:ci/check_certification_platform_lane.py" 2>/dev/null; then
            guard="${RUNNER_TEMP}/check_certification_platform_lane.py"
            manifest="${RUNNER_TEMP}/certification_platform_lane.json"
            git show "origin/${GITHUB_BASE_REF}:ci/check_certification_platform_lane.py" > "${guard}"
            git show "origin/${GITHUB_BASE_REF}:governance/certification_platform_lane.json" > "${manifest}"
            MC_PLATFORM_ROOT="${GITHUB_WORKSPACE}" \
            MC_PLATFORM_MANIFEST="${manifest}" \
              python3 "${guard}"
          else
            python3 ci/check_certification_platform_lane.py
          fi
          python3 ci/test_check_certification_platform_lane.py
          python3 ci/test_otp_finalize_family_replay_evidence.py
      - uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Capture canonical lake build diagnostic
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          lake build > diagnostics/lake-build.log 2>&1
          status=$?
          printf '%s\n' "$status" > diagnostics/lake-build.status
          cat diagnostics/lake-build.log
          exit 0
      - name: Run certification checks
        shell: bash
        run: |
          set -euo pipefail
          python ci/certification_route_state.py validate
          python ci/check_certification_route_state_consumers.py
          python ci/test_certification_route_state.py
          python ci/test_check_certification_route_state_consumers.py

          real_python="$(command -v python3)"
          shim_dir="${RUNNER_TEMP}/mathcert-route-state-bin"
          mkdir -p "${shim_dir}"
          cat > "${shim_dir}/python3" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${MATHCERT_REAL_PYTHON}" "${GITHUB_WORKSPACE}/ci/certification_route_state.py" exec "$@"
          EOF
          chmod +x "${shim_dir}/python3"

          MATHCERT_REAL_PYTHON="${real_python}" \
          PATH="${shim_dir}:${PATH}" \
            bash ./ci/check_lean.sh
      - name: Upload canonical build diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-canonical-lake-build-diagnostic
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
