name: Cert checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@6fe4ae6a449c9758f51250ee249ebbc7ec37ee48 # v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run certification checks
        run: bash ./ci/check_lean.sh
