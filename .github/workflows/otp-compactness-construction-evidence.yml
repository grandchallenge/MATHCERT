name: OTP Compactness construction evidence

on:
  pull_request:
    paths:
      - ".github/workflows/otp-compactness-construction-evidence.yml"
      - "requirements-ci.txt"
      - ".gitattributes"
      - "evidence/openai_ten_proofs/compactness_construction/**"
      - "governance/result_family_construction_evidence/OTP-J1-COMPACTNESS.json"
      - "schemas/openai_ten_proofs_compactness_construction_evidence.schema.json"
      - "ci/build_otp_compactness_construction_evidence.py"
      - "ci/verify_otp_compactness_construction_evidence.py"
      - "ci/validate_otp_compactness_construction_evidence.py"
      - "ci/test_otp_compactness_construction_evidence.py"
      - "governance/result_family_evidence_refreshes/OTP-J1-COMPACTNESS.json"
      - "governance/result_family_adjudication_contracts/OTP-J1-COMPACTNESS.json"
      - "governance/certification_routes.json"
      - "governance/ci_control_registry.json"
      - "ci/check_lean.sh"
      - "ci/check_lean.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construction-evidence-control:
    name: construction-evidence-control (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact Compactness construction-evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Reacquire exact current official source bytes
        run: >-
          python -c "import hashlib,urllib.request; u='https://cdn.openai.com/pdf/ten-proofs-oai.pdf'; b=urllib.request.urlopen(u,timeout=90).read(); h=hashlib.sha256(b).hexdigest(); assert len(b)==2266371, (len(b),'current source byte length drift'); assert h=='64b900d5fae6fe22f2ae1b8e3b712d20055194a6c81cf343a2455e5898ac7dd6', ('current source sha256 drift',h); print('exact current source reacquired',len(b),h); print('historical admitted identity retained only: 2266052 f318c6508c9d49ef876a5a26cd73928705f96c07bb43e92a0cb35bd3f666ea53; exact historical bytes not reacquired')"
      - name: Run deterministic construction producer
        run: python ci/build_otp_compactness_construction_evidence.py
      - name: Run independent construction verifier
        run: python ci/verify_otp_compactness_construction_evidence.py
      - name: Validate governed construction evidence
        run: python ci/validate_otp_compactness_construction_evidence.py
      - name: Run adversarial mutations
        run: python ci/test_otp_compactness_construction_evidence.py
