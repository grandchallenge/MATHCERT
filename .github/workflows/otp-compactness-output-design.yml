name: OTP Compactness output design

on:
  pull_request:
    paths:
      - ".github/workflows/otp-compactness-output-design.yml"
      - "requirements-ci.txt"
      - "governance/result_family_output_contracts/OTP-J1-COMPACTNESS.json"
      - "schemas/otp_compactness_output_contract.schema.json"
      - "schemas/otp_compactness_qualified_output.schema.json"
      - "ci/validate_otp_compactness_output_contract.py"
      - "ci/test_otp_compactness_output_contract.py"
      - "governance/result_family_adjudications/OTP-J1-COMPACTNESS.json"
      - "governance/result_family_construction_evidence/OTP-J1-COMPACTNESS.json"
      - "governance/certification_routes.json"
      - "governance/ci_control_registry.json"
      - "ci/check_lean.sh"
      - "ci/check_lean.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  output-design-control:
    name: output-design-control (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact output-design head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate Compactness output contract
        run: python ci/validate_otp_compactness_output_contract.py
      - name: Run adversarial mutations
        run: python ci/test_otp_compactness_output_contract.py
