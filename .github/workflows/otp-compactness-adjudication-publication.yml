name: OTP Compactness adjudication publication

on:
  pull_request:
    paths:
      - ".github/workflows/otp-compactness-adjudication-publication.yml"
      - "governance/result_family_adjudications/OTP-J1-COMPACTNESS.json"
      - "governance/result_family_adjudication_execution_inputs/OTP-J1-COMPACTNESS.json"
      - "schemas/openai_ten_proofs_compactness_adjudication.schema.json"
      - "schemas/openai_ten_proofs_compactness_adjudication_execution_input.schema.json"
      - "evidence/openai_ten_proofs/compactness_adjudication.zip.b64"
      - "ci/otp_compactness_adjudication_control.py"
      - "ci/otp_compactness_adjudication_input_control.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-control:
    name: publication-control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out exact publication head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Revalidate frozen authorized input
        run: python ci/certification_route_state.py exec ci/otp_compactness_adjudication_input_control.py --self-test
      - name: Validate bounded adjudication
        run: python ci/certification_route_state.py exec ci/otp_compactness_adjudication_control.py
      - name: Run adjudication mutation suite
        run: python ci/certification_route_state.py exec ci/otp_compactness_adjudication_control.py --self-test
