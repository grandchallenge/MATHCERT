name: OTP B2 spherical-codes exact replay
on:
  pull_request:
    paths:
      - '.github/workflows/otp-b2-spherical-codes-cert-replay.yml'
      - 'ci/run_openai_ten_proofs_spherical_codes_replay.sh'
      - 'ci/otp_finalize_family_replay_evidence.py'
      - 'ci/otp_b2_spherical_codes_replay_evidence.py'
      - 'ci/otp_b2_spherical_codes_replay_evidence_test.py'
      - 'governance/result_family_replay_evidence_successors/OTP-B2-SPHERICAL-CODES.json'
      - 'schemas/openai_ten_proofs_spherical_codes_replay_evidence.schema.json'
      - 'evidence/openai_ten_proofs_successors/b2-spherical-codes.tar.gz.b64'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay-b2-spherical-codes:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env: {MATHCERT_HEAD_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.MATHCERT_HEAD_SHA }}', fetch-depth: 0, persist-credentials: false}
      - run: test "$(git rev-parse HEAD)" = "$MATHCERT_HEAD_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: openai/ten-proofs, ref: 94bc0feb6a9ff12c7d31d6de640a725c9d43d2b6, path: upstream, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: grandchallenge/MATHFORGE, ref: 0520d8bae3853798f2edca67c526133e46847a54, path: forge, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: grandchallenge/MATHSOLVE, ref: 63efb94f28ecb12c55a492c2243a9f70d655f646, path: solve, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: Zouuup/landrun, ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4, path: landrun-src, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: leanprover/lean4export, ref: 4e7915201d3f9f04470d9eae002fa695f7cdc589, path: lean4export-src, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: ammkrn/nanoda_lib, ref: ddfac2bf5a7b56cb46e141494427ff3dd55963c7, path: nanoda-src, fetch-depth: 1, persist-credentials: false}
      - uses: grandchallenge/lean-action@138a564e38a62ce545e8d47d86a97628463aced4
        with: {auto-config: false, build: false, test: false, lint: false, use-mathlib-cache: false, lake-package-directory: upstream}
      - name: Activate Lean
        run: |
          elan toolchain list | grep -Fq 'leanprover/lean4:v4.32.0' || elan toolchain install leanprover/lean4:v4.32.0
          echo 'ELAN_TOOLCHAIN=leanprover/lean4:v4.32.0' >> "$GITHUB_ENV"
      - name: Build pinned helpers
        run: |
          (cd landrun-src && go build -trimpath -o ../landrun ./cmd/landrun)
          (cd lean4export-src && lake build)
          (cd nanoda-src && cargo build --release --locked)
          chmod +x ci/otp_landrun_argv_adapter.sh landrun
          echo "COMPARATOR_LANDRUN=$GITHUB_WORKSPACE/ci/otp_landrun_argv_adapter.sh" >> "$GITHUB_ENV"
          echo "COMPARATOR_LANDRUN_REAL=$GITHUB_WORKSPACE/landrun" >> "$GITHUB_ENV"
          echo "REAL_LANDRUN=$GITHUB_WORKSPACE/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_LEAN4EXPORT=$GITHUB_WORKSPACE/lean4export-src/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$GITHUB_WORKSPACE/nanoda-src/target/release/nanoda_bin" >> "$GITHUB_ENV"
      - working-directory: upstream
        run: lake exe cache get
      - name: Execute B2 replay
        run: |
          chmod +x ci/run_openai_ten_proofs_spherical_codes_replay.sh
          python ci/certification_route_state.py exec-bash ci/run_openai_ten_proofs_spherical_codes_replay.sh evidence/b2-spherical-codes
      - name: Materialize pending independent-review gate
        run: |
          cat > evidence/b2-spherical-codes/independent-review-attestation.json <<'JSON'
          {
            "state": "pending_final_evidence_head_review",
            "approval_recorded": false,
            "review_must_bind_final_evidence_head": true,
            "predeclared_approval_prohibited": true
          }
          JSON
      - name: Complete governed B2 evidence artifact set
        run: python3 ci/otp_finalize_family_replay_evidence.py OTP-B2-SPHERICAL-CODES evidence/b2-spherical-codes
      - name: Validate retained B2 replay evidence
        run: |
          python3 ci/certification_route_state.py exec ci/otp_b2_spherical_codes_replay_evidence.py
          python3 ci/certification_route_state.py exec ci/otp_b2_spherical_codes_replay_evidence_test.py -v
      - name: Emit deterministic bundle transport
        if: success()
        run: |
          echo OTP_EVIDENCE_B64_BEGIN
          base64 -w0 evidence/b2-spherical-codes/bundle.tar.gz
          echo
          echo OTP_EVIDENCE_B64_END
      - name: Upload B2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: otp-b2-spherical-codes-exact-evidence, path: 'evidence/b2-spherical-codes/', if-no-files-found: warn, retention-days: 30}
